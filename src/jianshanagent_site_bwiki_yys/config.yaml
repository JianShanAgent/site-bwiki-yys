# 站点插件 bwiki_yys 的默认配置（配置名 site.bwiki_yys）：BWiki 上的阴阳师剧情百科（wiki.biligame.com/yys）。
# core.wiki.yaml 里哪个 wiki 的 site 写成 bwiki_yys，就对那个 wiki 生效；它是 BWiki 上的站，核心带着的 BWiki 平台那一份（platform.bwiki）会先加载。分三段：
#   wiki       查询（/查）里这个站特有的东西
#   knowledge  知识库里这个站特有的东西：歌词页
#   extend     这个站对通用配置的补充：清洗规则、不入库的页面、提示词里的说法、人设……
# 某个部署要改：在实例的 config/site.bwiki_yys.yaml 里只写要改的项。

# ── 查询 ──────────────────────────────────────────────────────────────
# /查 大天狗：式神页上的模板把稀有度、上线日期、CV 这些记成了语义属性，一次语义查询取回全部式神，
# 由这个插件接进通用的查询
wiki:
  shikigami:
    # 哪些页面算式神（Semantic MediaWiki 的条件写法）：有「式神名」这个属性的页面
    condition: "[[式神名::+]]"
    # 这些值等于没填，卡片上不写：没有配音的写的是「暂无」，其余几样是页面预设里留着没改的占位值
    blank_values: ["暂无", "（待补充）", "没有的不填这行", "式神图鉴简介内容", "1900-01-01"]

# ── 知识库 ────────────────────────────────────────────────────────────
# 「音乐曲库」的歌词一首一页，标题是编号（音乐曲库/歌词/<专辑编号>-<曲序>），正文里没有歌名。
# 歌名、专辑、发行日期、对应的式神和活动记在数据页的源码里：入库时给歌词页配上，
# 文档的标题写成「《歌名》歌词」，歌词去掉时间轴、译文跟在原文后面
knowledge:
  lyrics:
    prefix: "音乐曲库/歌词/"       # 标题以它开头的页面是歌词页
    data_page: "音乐曲库/数据"     # 专辑和曲目记在这一页（它自己不入库，见下面的 exclude_titles）

# ── 对通用配置的补充 ──────────────────────────────────────────────────
# 配置名 → 要并进去的内容：名单和通用的合在一起，单个值以这里写的为准。
# 这一段读配置时就并进去了，不能在管理后台里改（要改这些项，去改它们所在的那份配置）
extend:
  # /查 的说明：这个站能查的不只是页面
  plugin.wiki_query:
    commands:
      lookup:
        description: "查询式神或 wiki 条目"

  # 查证工作流：问题分哪几类，提示词里的说法
  plugin.research:
    analysis:
      # 问题归哪一类（告诉查证员，也记进日志，方便以后看用户都在问什么）
      topics: [式神, 剧情, 设定, 活动, 皮肤, 音乐影像, 其它]
    wording:
      names: "式神、阴阳师、其它角色的名字，以及剧情篇章、活动、皮肤、地点、势力的名字"
      generic_words: [式神, 剧情, 活动]
      facts: "日期、名字、台词、剧情经过、档案里的设定"
      mixups: "别的篇章 / 别的活动 / 别的角色"
      analyst_note: "同一个角色常有几个形态（大天狗、少羽大天狗、大天狗·高天铁羽），各有各的页面、档案和剧情，看清每条资料说的是哪一个。"
      reviewer_note: "同一个角色常有几个形态，要核对资料说的是不是问的那一个。"
      keyword_nouns: "式神名、剧情篇章名、活动名"
      keyword_example: "大天狗 传记"

  # 对话入口：什么问题该查
  plugin.chat:
    prompts:
      facts: "涉及游戏内容（式神、剧情、设定、活动）必须先用工具查 wiki，以工具结果为准，不要凭记忆回答；工具查不到就直说没查到。"
      facts_research: "涉及游戏内容（式神、剧情、设定、台词、活动、皮肤、音乐）的问题，一律立刻调用 research 工具：你不需要分析问题、不需要自己想答案，也不要猜题意、不要凭记忆回答、不要自己写链接。拿不准是不是在问游戏时（出现了你不认识的名字、外号、简称），也调用 research，不要反问用户。闲聊、打招呼、问你是谁，直接回复。"
      research_description: "查证阴阳师相关的问题，并把结论直接回复给用户。凡是涉及游戏内容的问题（式神、档案、传记、剧情、设定、台词、活动、皮肤、音乐、影像）都必须调用它，不要凭记忆回答。用户的原话会原样交给它，它依次查 wiki 知识库、站内搜索（必要时联网），核对无误后把结论发给用户；调用以后你不用再回复。一条消息只调用一次。"

  plugin.memory:
    preference_examples: "怎么称呼、喜欢的式神、在看的剧情篇章"

  # 人设（管理后台里改过的话，以改过的为准）
  persona/persona.default:
    name: 阴阳师剧情百科助手
    description: >
      你是阴阳师剧情百科的查询助手，回答以 wiki 的内容为准，不确定时给出条目链接。
    personality: 简洁、可靠、角色和篇章的名字准确
    system_prompt: |
      你是阴阳师剧情百科的助手。事实性问题必须通过工具查询 wiki，不要编造剧情、设定或台词。
      回复简洁，适合 QQ 阅读；需要细节时附上 wiki 链接。
    example_dialogues:
      - user: 大天狗的传记讲了什么？
        assistant: 我先查一下 wiki 上「大天狗」的式神传记。

  # 知识库：这个站的清洗规则、不入库的页面、日期的门槛、验收点
  plugin.knowledge:
    sources:
      pages:
        # 明确不要的页面（标题完全一致）。都是给编辑用的，不是给读者看的内容
        exclude_titles:
          # 首页的各个板块：内容嵌在「首页」里，「首页」自己照常入库
          - "首页式神录板块"
          - "首页式神录板块/style.css"
          - "首页轮播图板块"
          - "首页阴阳师板块"
          - "首页编年史板块"
          - "首页支线板块"
          - "首页更多角色板块"
          - "首页考据整理板块"
          - "首页拓展阅读板块"
          - "首页常用功能板块"
          - "首页相关站务板块"
          - "首页关于我们板块"
          - "首页友情链接板块"
          - "首页外交链接板块"
          # 新建页面时套用的预设：正文是占位的说明
          - "文章预设"
          - "式神页面预设"
          - "花合战页面预设"
          - "活动剧情预设"
          - "剧情问题专栏预设"
          - "设定辞书条目预设"
          # 沙盒
          - "Sandbox:测试"
          - "Sandbox:终结片语通道测试"
          - "Sandbox:剧情对话语音测试"
          - "Sandbox:剧情对话长名字测试"
          - "沙盒/站点评分"
          - "沙盒/多语对照"
          - "沙盒/阴阳师编年史"
          - "沙盒/式神录"
          - "沙盒/seo测试"
          # 检索页背后的数据页：渲染出来的是字段怎么填的说明，数据本身由检索页的脚本读
          # （「音乐曲库/数据」里的歌名、专辑由这个插件配到歌词页上，见上面的 knowledge）
          - "插画藏馆/数据"
          - "影视频道/数据"
          - "影视频道/数据/皮肤"
          - "影视频道/数据/同人"
          - "影视频道/数据/录入范本"
          - "音乐曲库/数据"
          - "音乐曲库/数据录入范本"
          - "剧情评分合集/单页评分数据"
          - "剧情评分合集/活动评分数据"
    clean:
      # 按 class 整块移除（命中任意一个即移除）
      remove_classes:
        - role-card__image-frame       # 式神页的立绘框：里面只有图。它所在的标签页的名字（皮肤名）另外留着
        - role-bio__toc                # 式神传记前面的小目录（传记一、传记二……），下面各篇自己有标题
        - btn-tabs__list               # 按钮式标签页的那排按钮（相关视频的 CG / 式神鉴赏，剧情页的章节）：内容块里另有标题
        - oa__wordcount-global         # 插画故事页顶部的「本页共 … 字，阅读时间约 … 分钟」
        - crumb                        # 面包屑和它右边的「短 • 刷 • 阅 • 编 • 历」。它带着平台约定的导航 class，
                                       # 平时跟着去掉；整页只有导航块、导航块留下来的页面（「花合战」）上也不要它
    dates:
      min_year: 2016                 # 游戏 2016 年上线：更早的年份不算页面写了年份
    report:
      acceptance:
        page: "式神档册"               # 全部式神的一览表：UR 的那一行
        must_contain: ["大天狗·高天铁羽", "未来世界"]
